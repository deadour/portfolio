    />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme (or the system one) and language before the first paint.
      ;(function () {
        var theme, lang
        try {
          theme = localStorage.getItem('theme')
          lang = localStorage.getItem('lang')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        if (lang === 'es') document.documentElement.lang = 'es'
      })()
    </script>
    <link rel="canonical" href="https://eduramirez.dev/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
